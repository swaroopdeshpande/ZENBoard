<style>

  /* Display margin enforcement (calibrated frame offset) */
  .safe-content {
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
  }

  /* Vertical/portrait mode support */
  @media (max-height: 500px), (orientation: portrait) {
    .safe-content {
      width: 468px;
      height: 781px;
    }
  }

</style>
{% extends "plugin.html" %}

{% block content %}
<div class="text-content">
  <div class="title">{{ title }}</div>
  <div class="content">{{ content | safe }}</div>
</div>
{% endblock %}
