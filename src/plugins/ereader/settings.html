<div class="settings-container">
    <div class="form-group">
        <label class="form-label">Upload Book</label>
        <input type="file" id="bookUpload" accept=".epub,.pdf,.txt" class="form-input">
        <button type="button" class="action-button compact" onclick="uploadBook()">Upload</button>
        <div id="uploadStatus" style="font-size:12px; margin-top:4px;"></div>
    </div>
    <div class="form-group">
        <label class="form-label">Select Book</label>
        <select id="bookFile" name="bookFile" class="form-input"></select>
        <button type="button" class="action-button compact" onclick="deleteBook()" style="margin-top:6px;">Delete Selected</button>
    </div>
    <div class="form-group">
        <label class="form-label">Font</label>
        <select id="fontName" name="fontName" class="form-input">
            <option value="serif">Serif</option>
            <option value="serif-bold">Serif Bold</option>
            <option value="sans">Sans</option>
            <option value="mono">Mono</option>
            <option value="liberation">Liberation</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label">Font Size</label>
        <select id="fontSize" name="fontSize" class="form-input">
            <option value="16">16px</option>
            <option value="20" selected>20px</option>
            <option value="24">24px</option>
            <option value="28">28px</option>
            <option value="32">32px</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label">Background</label>
        <select id="bgColor" name="bgColor" class="form-input">
            <option value="white">White</option>
            <option value="cream">Cream</option>
            <option value="lightgrey">Light Grey</option>
            <option value="black">Dark (Black bg, White text)</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label">Orientation</label>
        <select id="orientation" name="orientation" class="form-input">
            <option value="landscape">Landscape</option>
            <option value="portrait">Portrait</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label">Partial Refresh on Page Turn</label>
        <select id="partialRefresh" name="partialRefresh" class="form-input">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label">Page Navigation</label>
        <div style="display:flex; gap:8px;">
            <button type="button" id="pgPrev" class="action-button compact" onclick="ereaderTurn('prev')">← Previous</button>
            <button type="button" id="pgNext" class="action-button compact" onclick="ereaderTurn('next')">Next →</button>
        </div>
        <input type="hidden" id="action" name="action" value="current">
    </div>
</div>
<script>
// The page buttons used to only set the hidden action field and stop there,
// so nothing was ever sent - a turn required clicking Update Now afterwards.
// They now submit through the page's own handleAction(), the same path Update
// Now uses, so the whole settings form goes along (the book, font and partial
// refresh setting all have to travel with it).
//
// The field is put back to "current" afterwards. It never used to be, so once
// you had clicked Next the field stayed on "next" and every later Update Now
// silently advanced another page.
async function ereaderTurn(dir) {
    const field = document.getElementById('action');
    const btns  = [document.getElementById('pgPrev'), document.getElementById('pgNext')];
    if (typeof handleAction !== 'function') {
        console.error('ereader: handleAction() unavailable');
        return;
    }
    field.value = dir;
    // A turn takes several seconds on the panel; without this a second click
    // queues another refresh behind the first.
    btns.forEach(b => { if (b) b.disabled = true; });
    try {
        await handleAction('update_now');
    } finally {
        field.value = 'current';
        btns.forEach(b => { if (b) b.disabled = false; });
    }
}
async function uploadBook() {
    const file = document.getElementById('bookUpload').files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('book', file);
    const r = await fetch('/api/ereader/upload', {method:'POST', body:fd});
    const d = await r.json();
    document.getElementById('uploadStatus').textContent = d.error || `Uploaded: ${d.filename}`;
    loadBooks();
}
async function loadBooks() {
    const r = await fetch('/api/ereader/list');
    const d = await r.json();
    const sel = document.getElementById('bookFile');
    const current = sel.value;
    sel.innerHTML = '';
    (d.books || []).forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.path;
        opt.textContent = `${b.name} (${b.size})`;
        if (b.path === current) opt.selected = true;
        sel.appendChild(opt);
    });
}
async function deleteBook() {
    const path = document.getElementById('bookFile').value;
    if (!path || !confirm('Delete this book?')) return;
    await fetch('/api/ereader/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path})});
    loadBooks();
}
document.addEventListener('DOMContentLoaded', () => {
    loadBooks();
    if (typeof pluginSettings !== 'undefined' && pluginSettings) {
        if (pluginSettings.fontName)       document.getElementById('fontName').value = pluginSettings.fontName;
        if (pluginSettings.fontSize)       document.getElementById('fontSize').value = pluginSettings.fontSize;
        if (pluginSettings.bgColor)        document.getElementById('bgColor').value = pluginSettings.bgColor;
        if (pluginSettings.orientation)    document.getElementById('orientation').value = pluginSettings.orientation;
        if (pluginSettings.partialRefresh) document.getElementById('partialRefresh').value = pluginSettings.partialRefresh;
    }
});
</script>
