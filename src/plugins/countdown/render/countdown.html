<style>

  /* Display margin enforcement (calibrated frame offset) */
  .safe-content {
    width: 781px;
    height: 468px;
    margin: 12px 11px 0 8px;  /* T=12 R=11 B=0 L=8 (horizontal) */
    background: white;
    overflow: hidden;
  }

  /* Vertical/portrait mode support */
  @media (max-height: 500px), (orientation: portrait) {
    .safe-content {
      width: 468px;
      height: 781px;
      margin: 8px 12px 11px 0;  /* T=8 R=12 B=11 L=0 (vertical) */
    }
  }

</style>
{% extends "plugin.html" %}

{% block content %}

<div class="countdown-container">
    <div class="countdown-wrapper" >
        <h1 class="title">{{title}}</h1>
        <p class="subtitle">{{date}}</p>
        <div class="day_count">{{day_count}}</div>
        <div class="label">{{label}}</div>
    </div>
</div>

{% endblock %}
