<style>

  /* Display margin enforcement (calibrated frame offset) */
  .safe-content {
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
  }

  /* Vertical/portrait mode support */
  @media (max-height: 500px), (orientation: portrait) {
    .safe-content {
      width: 468px;
      height: 781px;
    }
  }

</style>
{% extends "plugin.html" %}

{% block content %}

<div class="countdown-container">
    <div class="countdown-wrapper" >
        <h1 class="title">{{title}}</h1>
        <p class="subtitle">{{date}}</p>
        <div class="day_count">{{day_count}}</div>
        <div class="label">{{label}}</div>
    </div>
</div>

{% endblock %}
