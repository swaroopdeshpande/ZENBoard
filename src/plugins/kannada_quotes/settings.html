<div class="settings-container">
    <div class="form-group">
        <label class="form-label">Author</label>
        <select id="person" name="person" class="form-input">
            <option value="random">Random</option>
            {% for author in authors %}
            <option value="{{ author.value }}">{{ author.label }}</option>
            {% endfor %}
        </select>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (typeof pluginSettings !== 'undefined' && pluginSettings) {
        if (pluginSettings.person) document.getElementById('person').value = pluginSettings.person || 'random';
    }
});
</script>
