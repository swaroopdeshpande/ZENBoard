; ZenBoard presence node v2 - bare firmware, no WLED.
;
; ESP32-C3 (QFN32, 4MB embedded XMC flash). Reads the Waveshare HMMD
; mmWave over UART (ASCII "ON"/"OFF"/"Range N" at 115200), publishes
; presence to the same MQTT topics the old WLED node used, and drives
; one WS2812B on GPIO0: green while someone is in the room, red when
; empty (blinking red = WiFi/MQTT down, blue = OTA running).
;
; Detection: sustained-ON entry (~1.2s, range-gated), sustained-OFF
; release (post 90s hold), median-of-3 range gate (default <=450cm).
;
; OTA: ElegantOTA portal at http://presence-node.local/update +
; ArduinoOTA on :3232. min_spiffs partitions give two 1.9MB app slots.
; FIRST flash over USB erases + writes new partitions (normal).
;
; Wiring:
;   sensor TX -> GPIO3   (ESP receives)
;   sensor RX -> GPIO4   (ESP transmits; needed to set sensor thresholds)
;   sensor VCC -> 3.3V   GND -> GND
;   WS2812B   -> 5V, GND, data GPIO0
;
; After this USB flash, future updates need no cable:
;   browser:  http://presence-node.local/update  (upload .bin)
;   pio:      uncomment upload_protocol/upload_port below, then
;             `pio run -t upload`

[env:esp32c3_presence]
platform = espressif32
board = nologo_esp32c3_super_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_compat_mode = strict
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit NeoPixel@^1.12.3
  ayushsharma82/ElegantOTA@^4.0.0

; Future OTA upload from PlatformIO (works after this USB flash):
upload_protocol = espota
upload_port = presence-node.local
upload_flags =
  --port=3232
